<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragon Flight</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.23.1/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #map { position: absolute; inset: 0; }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    #hud-bottom {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .telemetry {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 14px;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.45);
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .hint {
      font-size: 12px;
      opacity: 0.85;
      margin-left: auto;
      background: rgba(0,0,0,0.45);
      padding: 6px 10px;
      border-radius: 4px;
    }
    #title {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.45);
      padding: 8px 12px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud">
    <div id="title">🐉 Dragon Flight</div>
    <div id="hud-bottom">
      <span id="hud-alt" class="telemetry">ALT 0m</span>
      <span id="hud-spd" class="telemetry">0 km/h</span>
      <span id="hud-hdg" class="telemetry">000°</span>
      <span id="hud-bnk" class="telemetry"></span>
      <span class="hint">W/S pitch · A/D bank · ↑↓ speed · ←→ camera · SPACE pause</span>
    </div>
  </div>
  <script src="https://unpkg.com/mapbox-gl/dist/mapbox-gl.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="dragon.js"></script>
</body>
</html>
